<section class="section shell blog-index" aria-labelledby="blog-title">
  <header class="blog-heading">
    <h1 id="blog-title">Blog</h1>
  </header>
  <div class="blog-post-list">
    {% for post in paginator.posts %}
    <article class="blog-list">{% include blog_card.html post=post %}</article>
    {% endfor %}
  </div>
  {% if paginator.next_page %}
  <div class="post-pagination">
    <a class="button button-outline load-more-posts" href="{{ paginator.next_page_path | relative_url }}">Load more posts</a>
  </div>
  {% endif %}
  <p class="blog-load-status" role="status"></p>
</section>
<script>
  (function () {
    var postList = document.querySelector('.blog-post-list');
    var pagination = document.querySelector('.post-pagination');

    if (pagination) {
      pagination.addEventListener('click', function (event) {
        var loadMore = event.target.closest('.load-more-posts');
        if (!loadMore || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        if (loadMore.classList.contains('is-loading')) { event.preventDefault(); return; }

        event.preventDefault();

        var nextPageUrl = loadMore.getAttribute('href');
        var originalText = loadMore.textContent;

        loadMore.textContent = 'Loading...';
        loadMore.classList.add('is-loading');
        postList.setAttribute('aria-busy', 'true');

        fetch(nextPageUrl)
          .then(function (response) {
            if (!response.ok) throw new Error('Unable to load more posts.');
            return response.text();
          })
          .then(function (html) {
            var nextPage = new DOMParser().parseFromString(html, 'text/html');
            var nextPosts = nextPage.querySelectorAll('.blog-post-list .blog-list');
            var nextLoadMore = nextPage.querySelector('.load-more-posts');

            nextPosts.forEach(function (post) {
              postList.appendChild(document.importNode(post, true));
            });

            postList.removeAttribute('aria-busy');
            if (nextPosts.length) postList.children[postList.children.length - nextPosts.length].querySelector('a').focus({ preventScroll: true });
            document.querySelector('.blog-load-status').textContent = nextPosts.length + ' more posts loaded.';
            if (nextLoadMore) {
              loadMore.setAttribute('href', nextLoadMore.getAttribute('href'));
              loadMore.textContent = originalText;
              loadMore.classList.remove('is-loading');
            } else {
              pagination.remove();
            }
          })
          .catch(function () {
            postList.removeAttribute('aria-busy');
            document.querySelector('.blog-load-status').textContent = 'Could not load more posts. Please try again.';
            loadMore.textContent = originalText;
            loadMore.classList.remove('is-loading');
          });
      });
    }
  }());
</script>
