<!-- Contact Section -->
<section class="site-section contact-section" id="contact">

  <div class="container">

    <!-- Section Heading -->
    <div class="row text-center">

      <!-- Section Header -->
      <header class="col-md-8 col-md-push-2 col-sm-12 section-header">
        <h2>{{ site.contact-title }}</h2>
        <hr class="normal">
      </header>

      <!-- Section Content -->
      <div class="col-md-8 col-md-push-2 col-sm-12 section-content">
        <p>{{ site.contact-description }}</p>
      </div>

    </div>

    <!-- Form Container -->
    <div class="row form-container">

      <!-- Contact Form -->
      <div class="col-md-8 col-md-push-2">
        <script src="https://unpkg.com/@botpoison/browser"></script>
        <iframe class="contact-submit-frame" name="contact-submit-frame" title="Contact form submission"></iframe>
        <form id="sera-contact-form" action="https://submit-form.com/F0Kjm3Mt" data-botpoison-public-key="pk_cf0b4aa4-5cde-4af9-b6ff-f3263297ec17" method="POST" target="contact-submit-frame" class="contact-form container-fluid" onsubmit="var message=this.elements.message;if(message.value.trim().length&lt;25){message.setCustomValidity('Please enter at least 25 characters (excluding leading and trailing whitespace).');message.reportValidity();return false;}document.querySelector('#sera-contact-form .send-button').disabled=true;document.querySelector('#sera-contact-form .contact-form-status').className='contact-form-status is-visible';document.querySelector('#sera-contact-form .contact-form-status').textContent='Sending message...';setTimeout(function(){document.querySelector('#sera-contact-form').reset();document.querySelector('#sera-contact-form .send-button').disabled=false;document.querySelector('#sera-contact-form .contact-form-status').className='contact-form-status is-visible is-success';document.querySelector('#sera-contact-form .contact-form-status').textContent='Message sent. Thank you! I will get back to you soon.';},1600);">
          <div class="col-md-12">
            <p class="contact-form-status" role="status" aria-live="polite"></p>
          </div>
          <div class="col-md-6">
            <input type="text" name="name" placeholder="Name" />
          </div>
          <div class="col-md-6">
            <input type="text" name="email" placeholder="Email" />
          </div>
          <div class="col-md-12">
            <textarea name="message" rows="8" cols="40" placeholder="Message (at least 25 characters)" required minlength="25" oninput="this.setCustomValidity(this.value.trim().length &lt; 25 ? 'Please enter at least 25 characters (excluding leading and trailing whitespace).' : '');"></textarea>
          </div>
          <div class="col-md-12 form-action">
            <button type="submit" class="send-button">Send Message</button>
          </div>
        </form>
      </div>

    </div>

  </div>
</section>
