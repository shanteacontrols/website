<!-- Blog Section -->
<section class="site-section blog-section" id="blog">
  <div class="container">
    <!-- Section Heading -->
    <div class="row text-center">
      <!-- Section Header -->
      <header class="col-md-8 col-md-push-2 col-sm-12 section-header">
        <h2>{{ site.blog-title }}</h2>
        <hr class="normal" />
      </header>

      <!-- Section Content -->
      <div class="col-md-8 col-md-push-2 col-sm-12 section-content">
        <p>{{ site.blog-description }}</p>
      </div>
    </div>

    <!-- Blog Articles Container -->
    <div class="row blog-articles-container">
      <!-- Jekyll LOOP -->
      {% for post in site.posts limit:3 %}

      <!-- Blog Article -->
      <div
        class="col-md-10 col-md-push-1 col-sm-12 col-xs-12"
      >
        <a class="blog-article-link" href="{{ site.baseurl }}{{ post.url }}">
          <article class="blog-article clearfix">
            {% if forloop.index == 1 %}
            <span class="featured-label">Latest Post</span>
            {% endif %}
            <h3 class="title">{{ post.title }}</h3>
            <span class="date">{{ post.date | date_to_long_string }}</span>
            <p>{{ post.excerpt | strip_html | truncatewords:30 }}</p>
            <span class="btn-read">Read More</span>
          </article>
        </a>
      </div>

      {% endfor %}
      <!-- /LOOP-->
    </div>

    <!-- View All Posts CTA -->
    <div class="row view-posts text-center">
      <hr class="normal" />
      <a
        href="blog/blog.html"
        class="button-cta button-focus col-md-3 col-sm-5 col-xs-8"
        >View all posts</a
      >
    </div>
  </div>
</section>
