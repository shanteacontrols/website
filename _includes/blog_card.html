<a class="blog-card" href="{{ include.post.url | relative_url }}">
  {% if include.post.image %}
  <img class="blog-card-image" src="{{ '/images/blog/' | append: include.post.image | relative_url }}" alt="" loading="lazy">
  {% endif %}
  <div class="blog-card-copy">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%B %-d, %Y' }}</time>
    <h2>{{ include.post.title | escape }}</h2>
    <p>{{ include.post.excerpt | strip_html | truncatewords: 30 }}</p>
    <span class="text-link">Read post <span aria-hidden="true">→</span></span>
  </div>
</a>
