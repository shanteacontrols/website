---
layout: blog
---
<article class="section shell blog-article">
  <header class="blog-article-heading">
    <a class="text-link" href="{{ '/blog/blog.html' | relative_url }}">← All posts</a>
    <h1>{{ page.title | escape }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
  </header>
  {% if page.image %}
  <img class="blog-article-image" src="{{ '/images/blog/' | append: page.image | relative_url }}" alt="{{ page.title | escape }}">
  {% endif %}
  <div class="entry-content">{{ content }}</div>
</article>
{% include related_posts.html %}
