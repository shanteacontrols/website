# Shantea Controls website
exclude:
- "*configurator palette*.png"
- OpenDeck
- node_modules
- opendeck-ui
- gulpfile.js
- package.json
- Gemfile
- README.md
- vendor
- gems
- documentation
- scripts
- Makefile
- package-lock.json
- Gemfile.lock
keep_files:
- css
- images
baseurl:
url: https://shanteacontrols.com
plugins:
- jekyll-paginate-v2
- jekyll-sitemap
permalink: "/:year/:month/:day/:title/"
pagination:
  enabled: true
  debug: true
  collection: posts
  per_page: 10
  permalink: "/pages/:num/"
  title: ":title - page :num"
  limit: 0
  sort_field: date
  sort_reverse: true
  tag: ''
  locale: ''
  trail:
    before: 2
    after: 2
  extension: html
  indexpage: blog
title: Shantea Controls
lang: en-US
facebook: https://www.facebook.com/shanteacontrolsmidi
github: https://github.com/shanteacontrols/OpenDeck
gallery:
  portfolio:
    title: Built with OpenDeck
    description: Explore a selection of controllers and custom builds made with OpenDeck.
  dubfocus16:
    title: DubFocus 16
    description: A custom OpenDeck-powered controller designed by Shantea Controls
      especially with dub producers in mind. 16 channels, high quality ALPS pots and
      faders, 32 Omron buttons with integrated red LEDs and USB-C connection. Contact
      for details on pricing and availability.
    dir: images/dubfocus
testimonials-title: Testimonials
testimonials:
- name: Liam Lacey
  cite: "(...) the most affordable and flexible platform for building your own custom
    MIDI controllers."
- name: Steve
  cite: The new interface is a triumph of usability and makes configuring controllers
    very easy indeed. In my opinion, this is the best MIDI controller available.
- name: Manuel
  cite: It's the pointy, finished and perfect board for all your DIY MIDI
- name: Ben Garland
  cite: OpenDeck makes me excited for MIDI controllers like never before. It takes
    just a few MINUTES to get up and running with OpenDeck! It's literally plug and
    PLAY!
- name: Scott Koopmann
  cite: OpenDeck is the future of DIY MIDI controller builds. Hands down
- name: David Dyball
  cite: I'm just blown away with how amazing this is. The web interface is super simple
    and really smooth to use.
- name: Barry Limestone
  cite: Literally the greatest product related to MIDI controls I have ever seen
- name: Andrey
  cite: wow it works right out of the box, impressive
- name: ckett
  cite: The OpenDeck platform has been the easiest and most stable board I have used
    to make a custom midi controller.
footer-description:
footer-copyright-text: Shantea Controls
footer-copyright-year: 2026
footer-location: Zagreb, Croatia
description: OpenDeck connects sensors and physical controls to your software using
  MIDI and OSC.
